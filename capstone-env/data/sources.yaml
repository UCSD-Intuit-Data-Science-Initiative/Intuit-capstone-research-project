# Pinned upstream sources for the fact layer (Stage 1).
#
# Each file is fetched from GitHub at the pinned commit and checked against
# the git blob id recorded here (from `git ls-tree -l <commit>`), so a
# download that is not byte-for-byte the pinned version is rejected.
# Only data, license and README files are fetched; upstream code is not.
#
# To change a pin: update commit + every file's git_blob/size, then re-lock
# checksums (see data/README.md) and log the change in CLAUDE.md.

