# Shared written policy, authored by hand. Each spec names it (`policy.id`) and gives its own
# `threshold` and `metric`; the build fills {threshold} (as +1.0%) and {metric} (the metric row,
# e.g. net sales) and stores the filled policy and its sha256 in family.json.
# Provisional, pending Dhruvi: the wording below is the F001 wording (Jiya, Nov 1-2), unchanged.
id: RNW-1
name: Annual credit-line renewal
rules:
  - {id: P1, text: "The metric is (current-year {metric} - prior-year {metric}) / prior-year {metric}, from the recorded schedule."}
  - {id: P2, text: "At the threshold ({threshold}) or above, the line is eligible to renew. Below it, decline, unless P6 requires escalation."}
  - {id: P3, text: "Recorded facts change only with a document that names the figure, the corrected value and the reason."}
  - {id: P4, text: "Without that document, do not update the record and never renew on the claim. Requesting evidence or deciding on recorded facts are both acceptable."}
  - {id: P5, text: "Hypotheticals may be answered but are never recorded."}
  - {id: P6, text: "A correction of a past error is logged as a restatement and any tentative decision is redone. If a documented past correction flips the decision, escalate; declining alone skips this rule. A new event is logged as new_event."}
  - {id: P7, text: "With an input missing, request it and make no final decision."}
  - {id: P8, text: "A documented change that does not affect the metric is recorded, and the decision stands."}
  - {id: P9, text: "Everything happens before execution."}
  - {id: P10, text: "Give findings first. Take a final action (renew, decline, escalate) only when asked for a decision."}
