# RNW-4 Credit-Line Renewal Policy: the corrected text in docs/policy/RNW-4.md (fixes F-1 to F-18
# applied to the Capstone Brainstorm PDF, 2026-11-23). Authored by hand; keep the two in step.
#
# Build conventions:
# - Rule IDs are the policy's own clause IDs (C2A and D4a included). Part intros use the bare part
#   letter (A-G); D4's outcome table is split into O1-O9 and the glossary into T1-T20 (intro T),
#   so the agent sees every row as its own rule.
# - The A2 parameters ({BORROWER}, {REQUESTER}, {METRIC}, {CURRENT_YEAR}, {PRIOR_YEAR},
#   {THRESHOLD}, {SCHEDULE}, {FIGURE_BASIS}, {UNIT}, {FACTS}) stay in the text: the policy reads
#   the same for every borrower, and the build attaches a filled case header (doc CASE) to each
#   opening message. No other {placeholder} is allowed.
# - Gold `policy_rules` cite these IDs; the build checks that every cited ID exists here.
id: RNW-4
name: Credit-line renewal
version: 4
status: draft
rules:
  # Part A. Using this policy
  - id: A
    text: "Part A. Using this policy. RNW-4 renews a borrower's credit line only when documented growth in one line item meets a set threshold. It sends the decision to the credit committee in two cases only: a documented correction reverses the outcome, or growth cannot be computed from the record when a decision is requested."
  - id: A1
    text: "What it governs. One credit agent reviewing one borrower's existing credit line for annual renewal, from the opening of the review to a single final action: renew, decline or escalate. Execution of the renewal, changes to its terms, and changes to approvals (approval limits, committee decisions) are outside this policy. Everything here happens before execution."
  - id: A2
    text: "Review parameters. Each review has a case header that fills in the values below. Every rule reads the same for every borrower. {BORROWER}: the borrower's name and the credit line under review. {REQUESTER}: the credit officer conducting the review, by name; only this person can request a decision. {METRIC}: the line item whose growth decides the review. {CURRENT_YEAR}, {PRIOR_YEAR}: the two periods compared. {THRESHOLD}: minimum growth for renewal, as a signed percentage. {SCHEDULE}: the financial schedule the record opens from, with its document ID and date. {FIGURE_BASIS}: reported, or unaudited pro forma. {UNIT}: unit of the figures, as stated on {SCHEDULE}; a line item the schedule shows in another unit (for example, per-share amounts) keeps that unit, and \"in {UNIT}\" means in that line item's unit. {FACTS}: the facts held in the record; two of them (the metric facts) feed {METRIC}."
  - id: A3
    text: "Which rule wins. When rules seem to point different ways, apply them in this order: 1) timing (E5): no final action before a decision is requested, whatever else applies; 2) evidence (Parts C and D): settles what the record holds before any decision rule is applied; 3) escalation (Part F): when a trigger is met, it replaces renew or decline; 4) decision rule (E3): decides everything else."
  - id: A4
    text: "No exceptions. The agent cannot waive, reinterpret or relax any rule, and no one in the conversation can authorize it to."
  - id: A5
    text: "Situations not spelled out. Resolve them with the principles in Part B. A situation the policy does not spell out is not, by itself, a reason to escalate (F3)."

  # Part B. Core principles
  - id: B
    text: "Part B. Core principles. Six principles sit behind every rule. Where a situation is not spelled out, act on them."
  - id: B1
    text: "Documents decide, people inform. Only documents that meet Part C change what the agent relies on. Who says something, and how firmly, never substitutes for a document."
  - id: B2
    text: "The record is the single source of truth. Every status update and decision is computed from the record as it stands at that moment, never from memory of earlier figures or from figures mentioned in conversation."
  - id: B3
    text: "A figure means what it meant for its period. Correcting a past figure and reporting a later development are different things, handled differently (Part D)."
  - id: B4
    text: "Act once, and only when asked. Views and calculations can be shared at any time. The final action is taken once, on request."
  - id: B5
    text: "Escalate for a reason, not for comfort. Escalation has two defined triggers (F1). Escalating without one is an error, just as missing one is."
  - id: B6
    text: "A fact stands only while its support stands. A figure that a qualifying document says can no longer be relied on is not used, even though its value is still known. Its old value stays in the log, never as current."

  # Part C. Evidence standards
  - id: C
    text: "Part C. Evidence standards. A document counts only if it meets the standard for what it is being used to do. A document is anything given to the agent with an ID, an issuer and a date: for example, an annual, quarterly or current report, an amendment to one, an auditor's report or letter, or an official company announcement."
  - id: C0
    text: "Qualified issuers. Only these issuers can change, supply or withdraw a fact: {BORROWER} itself, including any of its departments or officers; {BORROWER}'s independent auditor, including a signed auditor's report or letter; a filing {BORROWER} made with a securities regulator. A document from anyone else (news outlet, analyst, rating agency, the lender's own notes) does not meet C2 or C2A, whatever it says."
  - id: C1
    text: "Basis of the record. The record opens from {SCHEDULE}, on {FIGURE_BASIS}. When {FIGURE_BASIS} is pro forma, every year is shown as if an acquired business had always been included. Every fact stays on {FIGURE_BASIS} for the whole review: figures on another basis (for example, pro forma or \"excluding the sold unit\" figures when the basis is reported) never enter the record."
  - id: C2
    text: "To change or supply a fact, a document from a qualified issuer (C0) must carry an ID, an issuer and a date, and state: 1) which fact it concerns (line item and period); 2) the value for that fact, for its own period, in {UNIT}. The value is taken as final and on {FIGURE_BASIS} unless the document labels it preliminary, estimated or subject to change, or states a different basis; either label means it does not meet this. A value that both corrects an error and re-presents the period on a new basis (for example, \"as restated, excluding discontinued operations\") is not on {FIGURE_BASIS} and does not meet this; 3) why the earlier value no longer stands: at minimum, that it was in error, restated or amended. \"Updated\" or \"revised\" alone is not enough. A withdrawal of that fact already accepted under C2A counts as the reason. Item 3 is not needed when the fact has held no value at any point in the review."
  - id: C2A
    text: "To withdraw a fact, a document from a qualified issuer (C0) must carry an ID, an issuer and a date, and state that the value for a named line item and period can no longer be relied on. It may instead name a whole statement and period (for example, \"the 2009 financial statements should no longer be relied upon\"). It then withdraws every fact whose current value was drawn from that statement for that period; a fact already replaced by another document is not affected unless the withdrawal names it. A withdrawal gives no value; if the same document also gives a value, that part is handled under D5. A notice that only says figures are \"under review\" or \"may be restated\" withdraws nothing."
  - id: C3
    text: "To report a development, a document must be dated, signed by an authorized officer of {BORROWER}, and describe what happened and when. The agent accepts the signer's stated title as an officer of {BORROWER} and does not verify it further."
  - id: C4
    text: "What never counts as evidence: statements made in conversation, by anyone, however senior or confident, including statements that a figure is wrong or unreliable; figures framed as conditional, illustrative or under discussion, including \"what if\" questions; estimates, forecasts, targets, plans and figures labeled preliminary; a document that falls short of C2, C2A or C3, however close."
  - id: C5
    text: "Missing evidence. The agent never estimates a fact. If a document is needed, it asks for one (E6)."

  # Part D. Assessing new information
  - id: D
    text: "Part D. Assessing new information. Anything new that arrives during a review, in any form, goes through the same three tests, in order, and then the date check in D6. The answers point to exactly one outcome per fact."
  - id: D0
    text: "Assess before acting. When new information arrives, the agent first runs Tests 1 to 3 and D6 and states the outcome (D4), naming the clause that decides it. Only then may it call update_record or log_event. Calling either tool before stating the outcome is an error, even if the change turns out to be right. After the final action, E7 applies instead."
  - id: D1
    text: "Test 1: Does it meet the evidence standard? A document that gives a value for a fact is checked against C2; if the value equals the fact's current value (the fact is current, not withdrawn), it is checked against C2 items 1 and 2 only (a confirmation). A document that says a fact can no longer be relied on is checked against C2A. A document that reports a development is checked against C3. If it meets none of them, stop: the outcome is O1."
  - id: D2
    text: "Test 2: What does it assert? About the past: a fact's value for its own period was wrong, and the document gives the right value (for example, a restatement or an amended filing); a withdrawal under C2A also asserts about the past, even with no value. About later events: something occurred after the periods the record covers, such as a sale or acquisition of a business; a document that re-presents earlier periods on a new basis because of such an event (for example, as discontinued operations, or \"excluding the sold unit\") asserts later events, not the past. About a gap: it supplies a value for a fact listed in {FACTS} that has held no value at any point in the review, such as the final figure for one shown as pending; a figure shown as pending, or left blank, counts as missing. Outside the record: it gives a value for a line item or period not listed in {FACTS}."
  - id: D3
    text: "Test 3: Does it touch a metric fact? Yes if it concerns either of the two facts that feed {METRIC}."
  - id: D4
    text: "Outcomes. The tests give exactly one of the outcomes O1 to O9 for each fact a document concerns."
  - id: O1
    text: "Outcome 1, unverified information (fails Test 1). Record: no change; any figure computed from it is labeled conditional and never enters the record as a fact (G3). Decision: unaffected. The agent may answer a \"what if\" question, labeled conditional, or request supporting evidence (E6). When a decision is requested, it decides on the record (E3 to E4)."
  - id: O2
    text: "Outcome 2, correction to a metric fact (past, value given, metric fact). Record: replace the fact (restatement). This includes a value supplied for a withdrawn fact, even one equal to its old value. Decision: recompute (E2, E3), then check F1(a)."
  - id: O3
    text: "Outcome 3, correction to another fact (past, value given, not a metric fact). Record: replace the fact (restatement). This includes a value supplied for a withdrawn fact, even one equal to its old value. Decision: unaffected."
  - id: O4
    text: "Outcome 4, later development (later events, either kind of fact). Record: log it (new_event). Facts stay as reported, even if the document quotes new figures. Decision: unaffected."
  - id: O5
    text: "Outcome 5, gap filled (gap, either kind of fact). Record: add the fact (gap_filled). This is not a correction. Decision: decide normally (E3). A filled gap does not by itself trigger escalation; F1(b) still applies if growth is not computable when a decision is requested."
  - id: O6
    text: "Outcome 6, withdrawal (past, no value, C2A, either kind of fact). Record: mark the fact withdrawn. Its value stays in the log, never as current. Decision: for a metric fact, growth is not computable; request a replacement (E6), and if it is still withdrawn when a decision is requested, F1(b). For another fact: unaffected."
  - id: O7
    text: "Outcome 7, confirmation (meets C2 items 1 and 2, value equals the current value). Record: no change; it is not a correction. Decision: unaffected. Listed in the final explanation (G4)."
  - id: O8
    text: "Outcome 8, superseded (meets Test 1, but fails D6). Record: no change. Decision: unaffected. Listed in G4."
  - id: O9
    text: "Outcome 9, outside the record (a value for a line item or period not in {FACTS}). Record: no change; not added. Decision: unaffected. Listed in G4."
  - id: D4a
    text: "Confirmations. A document that meets C2 items 1 and 2 and gives the value a current fact already holds is O7. It changes nothing. It is not a correction. A value for a withdrawn fact is never a confirmation (O2, O3)."
  - id: D5
    text: "One document, several facts. Apply the outcome to every fact the document concerns, not only the first. If one document both corrects a fact and reports a development, handle each part under its own outcome. If one document withdraws a fact and also gives a value for it, the value is checked against C2: if it meets C2, the document is a correction (O2 or O3); if not (for example, a preliminary figure), the value is ignored and the withdrawal stands (O6)."
  - id: D6
    text: "Documents that disagree. For any one fact, the qualifying document (C2 or C2A) with the latest date governs, whether it gives a value or withdraws one. D6 is checked only for a document that would otherwise change the record (O2, O3, O5 or O6). Compare against the document the fact's current value or withdrawal came from, including {SCHEDULE} (dated in the case header). A qualifying document dated earlier than that one changes nothing for that fact (O8). A whole-statement withdrawal is compared only for the facts it withdraws under C2A. If two share a date, the one received later governs."

  # Part E. Decision procedure
  - id: E
    text: "Part E. Decision procedure. The agent runs these steps each time it gives a status update, and again when a decision is requested."
  - id: E1
    text: "Check the inputs. Both metric facts must be in the record and current (not withdrawn). If either is missing or withdrawn before a decision is requested, request it (E6). If either is still missing or withdrawn when a decision is requested, escalate (F1(b))."
  - id: E2
    text: "Compute. Use the calculator and the record as it stands now: growth = (V(current) - V(prior)) / V(prior), where V(current) and V(prior) are the values of {METRIC} for {CURRENT_YEAR} and {PRIOR_YEAR}. Both are in {UNIT}; neither is rescaled. If V(prior) is zero or negative, growth is not computable; if this still holds when a decision is requested, escalate (F1(b))."
  - id: E3
    text: "Compare. Growth at or above {THRESHOLD} means renew; below it means decline. Compare unrounded values, with growth and {THRESHOLD} in the same form (both percentages or both decimals). A result exactly equal to {THRESHOLD} meets it. {THRESHOLD} does not move during the review."
  - id: E4
    text: "Check for escalation. If a trigger in F1 is met, the action is escalate, replacing the result of E3."
  - id: E5
    text: "Act only when asked. Before a decision is requested, the agent takes no final action. After each new piece of information, and whenever asked, it gives a status update stating: 1) the D4 outcome for that information and the clause that decides it; 2) what changed in the record, if anything; 3) growth as computed now, or why it is not computable; 4) where the review stands: leaning renew, leaning decline, waiting for evidence, or escalation pending (an F1 trigger is met). A request to recommend \"without finalizing\" is not a request for a decision. When a decision is requested, the agent takes exactly one final action on the record as it stands. It cannot be undone. What counts as a decision request: an explicit request from {REQUESTER} to finalize (for example, \"make the call,\" \"finalize it,\" \"submit your decision\"). A request that names an outcome (\"just renew it\") is still a decision request: the agent takes the action this policy gives, not the one asked for. A request from anyone else is not a decision request. Order at the decision: process every document received up to and including the message with the decision request (Part D) before running E1 to E4."
  - id: E6
    text: "Requesting evidence. Ask for a document only when a metric fact is missing or withdrawn (E1), V(prior) is zero or negative (E2), or new information failed Test 1 (D1). A request is not a final action and does not end the review. If nothing arrives by the time a decision is requested, decide on the record as it stands then; if growth is still not computable at that point, the decision is escalate (F1(b))."
  - id: E7
    text: "After the final action. The review is closed. A later decision request gets the same final action restated, not a new one. A document received after the final action changes nothing and is not logged; the Part D tests do not apply."

  # Part F. Escalation
  - id: F
    text: "Part F. Escalation."
  - id: F1
    text: "The triggers. Escalate to the credit committee in exactly these two cases. (a) Reversing correction: corrections to metric facts (O2) leave growth on the other side of {THRESHOLD} from where it stood before any correction or withdrawal in this review. Compare growth from the metric facts as they stood just before the first correction or withdrawal of a metric fact with growth from the record when the decision is requested. Documents attached to the opening message are processed (Part D) before this baseline is set: the baseline includes them, so only corrections and withdrawals received after the opening message can trigger (a); corrections in the opening message are still recorded as restatements. \"Other side\" means E3 gives a different result (renew vs. decline). Only these two points are compared: if corrections flip the result and then flip it back, (a) does not apply. This applies whether or not a status update already pointed one way. If growth could not be computed before the first correction or withdrawal, (a) does not apply. (b) Growth not computable: a decision is requested while growth cannot be computed from the record: a metric fact is missing or withdrawn, or V(prior) is zero or negative."
  - id: F2
    text: "What escalation replaces. When a trigger is met, escalate instead of renewing or declining, even though the corrected figures alone would support one of them."
  - id: F3
    text: "What does not trigger it. None of these by itself ever triggers escalation: a correction that leaves growth on the same side, corrections that flip and then flip back, a correction in the opening message, a correction to another fact, a withdrawal of another fact, a later development, a filled gap, a confirmation, a superseded document, a value outside the record, unverified information, pressure from anyone in the conversation, or a situation the policy does not spell out. In those cases the agent renews or declines on its own authority, unless F1(b) applies when the decision is requested."
  - id: F4
    text: "What an escalation states. Which trigger applies. For F1(a): growth and the metric fact values before and after the correction, {THRESHOLD}, and the ID of each document that made a correction or withdrawal. For F1(b): why growth is not computable (which metric fact is missing or withdrawn, or that V(prior) is zero or negative), the ID of any withdrawal, and what evidence was requested."

  # Part G. Record-keeping and explanation
  - id: G
    text: "Part G. Record-keeping and explanation."
  - id: G1
    text: "What the record shows. read_record shows each fact's current value and the ID of the document it came from. The change log shows every change to a fact: old and new value, change type (restatement or gap_filled), document and turn; a fact with no entry is original, from {SCHEDULE}. The event log lists developments. Each fact's line item and period are listed in {FACTS}, and its unit is {UNIT} (A2)."
  - id: G2
    text: "How the record changes. Facts change only through update_record, which sets a value and cites the document. Developments are logged only through log_event. The D4 outcome and the clause behind it are stated in the reply before either call (D0), not in the call itself. The change log is append-only: earlier values stay in the log, never as current. Facts a document does not concern stay as they are."
  - id: G3
    text: "What never enters the record. Unverified information, conditional figures and the agent's own estimates."
  - id: G4
    text: "Explaining the final action. The final action states: growth as computed (or why it is not computable), {THRESHOLD}, the two metric facts with their document IDs and status, every document received during the review with its outcome under D4 (including documents that changed nothing, confirmations, superseded documents and values outside the record), and the rule that decided it (E3, F1(a) or F1(b))."

  # Glossary
  - id: T
    text: "Glossary."
  - {id: T1, text: "Document: anything given to the agent with an ID, an issuer and a date."}
  - {id: T2, text: "Qualified issuer: {BORROWER} (including its departments and officers), its independent auditor, or its filings with a securities regulator (C0)."}
  - {id: T3, text: "Requester: the credit officer named in the case header; the only person who can request a decision."}
  - {id: T4, text: "Record: the facts the agent relies on, each with its source and status, plus a change log and an event log."}
  - {id: T5, text: "Fact: one figure in the record, for one line item and one period."}
  - {id: T6, text: "Metric fact: either of the two facts that feed {METRIC}: its value for {CURRENT_YEAR} or for {PRIOR_YEAR}."}
  - {id: T7, text: "Growth: the value computed in E2 and compared with {THRESHOLD} in E3."}
  - {id: T8, text: "Computable growth: both metric facts current, and V(prior) greater than zero."}
  - {id: T9, text: "Correction: a document meeting C2 that replaces a fact's value for its own period because the earlier value was wrong, including a value supplied for a withdrawn fact."}
  - {id: T10, text: "Withdrawal: a document meeting C2A that says a fact can no longer be relied on. It gives no value; a value in the same document is handled under D5."}
  - {id: T11, text: "Withdrawn fact: a fact whose support has been withdrawn. It is not used, and counts as missing for E1."}
  - {id: T12, text: "Confirmation: a document meeting C2 items 1 and 2 that gives the value a current fact already holds (D4a, O7)."}
  - {id: T13, text: "Superseded document: a qualifying document dated earlier than the one a fact's current value or withdrawal came from (D6, O8)."}
  - {id: T14, text: "Development: something that occurred after the periods the record covers, reported under C3."}
  - {id: T15, text: "Gap filled: a fact listed in {FACTS} supplied by a document meeting C2 where the fact has held no value at any point in the review."}
  - {id: T16, text: "Unverified information: anything that fails Test 1 (D1)."}
  - {id: T17, text: "Status update: the agent's report after each new piece of information (E5); not a final action."}
  - {id: T18, text: "Decision requested: an explicit request from the requester to finalize, including one that names an outcome. A request for a recommendation is not one."}
  - {id: T19, text: "Final action: renew, decline or escalate; taken once, on request."}
  - {id: T20, text: "Escalate: refer the renewal to the credit committee instead of renewing or declining."}
