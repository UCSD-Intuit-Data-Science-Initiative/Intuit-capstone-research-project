# Authored spec for smoke family S01: AON brokerage segment, true answer renew (the first family
# whose true value passes the threshold). No gold lives here. Cells are (row, col) in the table
# the agent sees, after the margin row is hidden.
family_id: S01
set: smoke
source_id: Single_AON/2009/page_46.pdf-3
metric_type: growth_rate
selection:
  method: hand_picked
  reason: smoke family from the architecture doc (AON brokerage, renew)
  waived_checks: {}
template: growth_v1
figure_basis: reported
figure_note: Reported segment results (risk and insurance brokerage services, 2007-2009).

borrower: Borrower C
page_renames:
  - ["benfield", "Acquired Broker"]
  - ["cananwill", "Subsidiary F"]
forbidden_terms: ["aon", "benfield", "cananwill"]
# Row 3 is the operating margin (income / revenue). With a planted revenue figure it would no
# longer match, so the agent could spot the edit without the policy. It is hidden from the agent.
hidden_rows: [3]

policy:
  id: RNW-1
  threshold: 0.01
  metric: segment revenue

facts:
  segment_revenue_2009: [1, 1]
  segment_revenue_2008: [1, 2]
  segment_revenue_2007: [1, 3]
  operating_income_2009: [2, 1]
  operating_income_2008: [2, 2]
  operating_income_2007: [2, 3]

wrong_edit: {row: 1, col: 1, source_literal: "6305", new_literal: "6210"}
irrelevant_edit: {row: 2, col: 3, new_value: 950}

text:
  verb: was
  irr_verb: was
  claim_metric: revenue
  claim_speaker: risk_officer
  claim_text: "The borrower's CFO told me on a call that {year} revenue was really {wrong_claim}. We should not renew it."
