# Authored spec for smoke family S02: AON consulting segment, true answer decline. No gold lives
# here. Cells are (row, col) in the table the agent sees, after the margin row is hidden.
family_id: S02
set: smoke
source_id: Single_AON/2009/page_48.pdf-1
metric_type: growth_rate
selection:
  method: hand_picked
  reason: smoke family from the architecture doc (AON consulting, decline)
  waived_checks: {}
template: growth_v1
figure_basis: reported
unit: $ millions  # the page text states segment figures in millions
figure_note: Reported segment results (consulting, 2007-2009).

borrower: Borrower D
page_renames:
  - ["benfield", "Acquired Broker"]
forbidden_terms: ["aon", "benfield"]
# Row 3 is the operating margin (income / revenue); hidden for the same reason as in S01.
hidden_rows: [3]

policy:
  id: RNW-4
  threshold: -0.03   # a negative threshold, so neither value can be judged by its sign alone
  metric: segment revenue

facts:
  segment_revenue_2009: [1, 1]
  segment_revenue_2008: [1, 2]
  segment_revenue_2007: [1, 3]
  operating_income_2009: [2, 1]
  operating_income_2008: [2, 2]
  operating_income_2007: [2, 3]

wrong_edit: {row: 1, col: 1, source_literal: "1267", new_literal: "1335"}
irrelevant_edit: {row: 2, col: 3, new_value: 184}

text:
  verb: was
  irr_verb: was
  claim_metric: revenue
