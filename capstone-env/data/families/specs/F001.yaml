# Authored spec for family F001. No gold lives here: answers, records, action classes and
# margins are computed by `python -m capstone.data.family`. Do not edit the outputs.
# The 9 versions and their wording come from the shared template; this file holds only what is
# specific to this table. Cells are (row, col) in the table the agent sees.
family_id: F001
set: pilot
source_id: Single_LMT/2016/page_85.pdf-1
metric_type: growth_rate
selection:
  method: draw
  prefilter_labels: false   # F001 was drawn before the allowed-label rule; it is logged as a check
template: growth_v1
figure_basis: unaudited_pro_forma
figure_note: >-
  All figures are unaudited pro forma: they show the company as if the acquired business had
  been included for all of 2014 and 2015. They are not reported results. Policy rule P12 makes
  the pro forma schedule the basis of the review.

borrower: Borrower A
# Applied in order to the page text and the source questions. forbidden_terms must not survive.
page_renames:
  - ["sikorsky 2019s", "Acquired Business's"]
  - ["sikorsky", "Acquired Business"]
  - ["our rms business", "one of our business segments"]
forbidden_terms: ["sikorsky", "lockheed", "rms"]
hidden_rows: []

policy:            # shared text in data/families/policies/RNW-1.yaml; this family fills it in
  id: RNW-1
  threshold: 0.01
  metric: net sales

facts:
  net_sales_2015: [1, 1]
  net_sales_2014: [1, 2]
  net_earnings_2015: [2, 1]
  net_earnings_2014: [2, 2]
  basic_eps_2015: [3, 1]
  basic_eps_2014: [3, 2]
  diluted_eps_2015: [4, 1]
  diluted_eps_2014: [4, 2]

wrong_edit: {row: 1, col: 1, source_literal: "45366", new_literal: "48790"}
irrelevant_edit: {row: 4, col: 2, new_value: 10.80}

text:
  schedule_title: Supplemental pro forma schedule (unaudited)
  claim_metric: sales
