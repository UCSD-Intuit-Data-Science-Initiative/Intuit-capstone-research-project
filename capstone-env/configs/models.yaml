# What each --model name means. Fill in `model:` for the entries you use,
# the same way .env holds the API keys (keys never go in this file).
#
#   provider  anthropic | openai | openrouter | mock
#   model     the provider's model id; runs refuse to start while it is blank
#   params    passed straight into the API call (max_tokens, effort, temperature, ...)
#   price     USD per 1M tokens, used to compute cost; OpenRouter reports cost itself
#
# Add more entries freely (e.g. two Claude models); the entry name is what
# shows up in run ids and results tables.

claude:                 # API model (Anthropic Messages API, key: ANTHROPIC_API_KEY)
  provider: anthropic
  model: claude-opus-5-5  # first real run (Stage 6 PR 4); change here to test another model
  # Thinking is always on (adaptive) for this model. Effort defaults to medium on it, so it is set
  # explicitly. No server-side fallbacks: every answer must come from the model named above, and a
  # refusal is recorded in the trace (stop_reason "refusal") and labelled by the grader.
  params:
    max_tokens: 16000
    output_config: {effort: high}
  price: {input: 4.00, output: 20.00}   # USD per 1M tokens (Anthropic list price, Nov 2026)

openai:                 # OpenAI Chat Completions (key: OPENAI_API_KEY)
  provider: openai
  model:
  params: {}
  price: {input: null, output: null}

open-weight:            # open-weight model served through OpenRouter (key: OPENROUTER_API_KEY)
  provider: openrouter
  model:
  params: {}

mock:                   # no key, no network: replies "OK." to every turn; for checking the pipeline
  provider: mock
